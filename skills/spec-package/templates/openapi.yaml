    get:
      operationId: readExample
      summary: <what this one path does>
      responses:
        "200":
          description: <what the caller receives>
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
        "404":
          description: <the failure the caller can observe>
